# MK-UNet (large) on ClinicDB — overrides on top of base_config.yaml.
# See ../../base_config.yaml for every inherited default (early stopping,
# EMA, augmentation, checkpointing, etc.).
compose: ["../../base_config.yaml"]

model:
  name: "mk_unet"
  channels: [64, 128, 256, 384, 512]
  depths: [1, 1, 1, 1, 1]        # MKIR depth at each stage
  kernel_sizes: [1, 3, 5]        # MKDC kernel sizes
  expansion_factor: 2
  gag_kernel: 3

dataset:
  batch_size: 16

logging:
  log_dir: "logs"
  tb_dir: "runs"           # TensorBoard event log directory
  experiment_name: "mkunet_l_clinicdb"
  log_interval: 10         # Print/log training progress every N batches
  experiment_name: "mkunet_l_clinicdb"
