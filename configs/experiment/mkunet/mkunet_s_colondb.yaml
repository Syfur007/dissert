# MK-UNet (small) on ColonDB — composes the shared base config, the ColonDB
# dataset identity, and the small model-size fragment; only per-experiment
# overrides (batch size, run name) are listed here. See ../../base.yaml for
# every inherited default (early stopping, EMA, augmentation, checkpointing).
#
# FIX (Phase 1, see CHANGELOG.md): this file previously composed only
# ../../base_config.yaml and never overrode dataset.name/dataset.root, so it
# silently inherited base's ClinicDB dataset while its filename, checkpoint
# directory, and experiment_name all claimed ColonDB. Every checkpoint under
# checkpoints/mkunet_s_colondb/ predates this fix and is actually a ClinicDB
# run — do not cite it as a ColonDB result; re-run this config to get a real
# ColonDB checkpoint.
compose: ["../../base.yaml", "../../dataset/colondb.yaml", "../../model/mkunet/s.yaml"]

dataset:
  batch_size: 16

logging:
  experiment_name: "mkunet_s_colondb"
