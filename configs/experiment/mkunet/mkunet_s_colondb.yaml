# MK-UNet (small) on ColonDB — overrides on top of base_config.yaml.
# See ../../base_config.yaml for every inherited default (early stopping,
# EMA, augmentation, checkpointing, etc.).
compose: ["../../base_config.yaml"]

model:
  name: "mk_unet_s"
  channels: [8, 16, 32, 48, 80]
  depths: [1, 1, 1, 1, 1]        # MKIR depth at each stage
  kernel_sizes: [1, 3, 5]        # MKDC kernel sizes
  expansion_factor: 2
  gag_kernel: 3

dataset:
  name: "ColonDB"
  root: "data/polyp/ColonDB"
  batch_size: 16

logging:
  experiment_name: "mkunet_s_colondb"
