# MK-UNet (medium) on ClinicDB — overrides on top of base_config.yaml.
# See ../../base_config.yaml for every inherited default (early stopping,
# EMA, augmentation, checkpointing, etc.).
compose: ["../../base_config.yaml"]

model:
  name: "mk_unet"
  channels: [32, 64, 128, 192, 320]
  depths: [1, 1, 1, 1, 1]        # MKIR depth at each stage
  kernel_sizes: [1, 3, 5]        # MKDC kernel sizes
  expansion_factor: 2
  gag_kernel: 3

dataset:
  batch_size: 16

