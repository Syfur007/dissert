# Configuration settings for Deep Learning Segmentation Pipeline

model:
  name: "gmk_unet"             # "unet", "attention_unet", or "mk_unet"
  in_channels: 3
  out_channels: 1          # 1 for binary segmentation, >1 for multi-class
  channels: [8, 16, 32, 48, 80] 
  depths: [1, 1, 1, 1, 1]          # MKIR depth at each stage
  kernel_sizes: [1, 3, 5]       # MKDC kernel sizes 
  expansion_factor: 2
  gag_kernel: 3
  use_rgb_skip: true


dataset:
  name: "ClinicDB"
  root: "data/polyp/ClinicDB"

  # Optional: override the list files used for each split (defaults are inside root/)
  # train_list: "data/polyp/ClinicDB/train_list_clinicdb.txt"
  # val_list:   "data/polyp/ClinicDB/val_list_clinicdb.txt"
  # test_list:  "data/polyp/ClinicDB/test_list_clinicdb.txt"

  img_height: 256
  img_width: 256
  batch_size: 16
  num_workers: 4

  # Dataset-specific normalisation stats.
  # Run `python -m datasets.stats --config <this_file>` on the training split
  # to compute these values for a new dataset, then paste the output here.
  # When absent, ImageNet defaults are used (appropriate for natural images;
  # suboptimal for ACDC, DSB18 etc).
  # norm_mean: [0.485, 0.456, 0.406]
  # norm_std:  [0.229, 0.224, 0.225]

  # Integrity check: scan all pairs at startup and report every broken pair
  # before training begins.  Disable for very large datasets where the I/O
  # cost at launch is unacceptable.
  validate: false

  # In-RAM caching: load all raw images into memory on construction.
  # Guarded by cache_size_limit_gb — silently disabled if the dataset
  # would exceed that footprint.  Worthwhile for small datasets (BUSI,
  # ISIC18) during heavy ablation sweeps.
  cache: true
  cache_size_limit_gb: 4.0   # safe for a 16 GB RAM machine

  # Auto-split ratios.  Only needed for flat-directory datasets that do not
  # ship with pre-made train/val/test splits (e.g. raw ISIC18 / DSB18 dumps).
  # Ignored when the dataset has a registered handler with its own splits.
  # split:
  #   train: 0.8
  #   val:   0.1
  #   test:  0.1

  # Augmentation parameters.  Omitting any key keeps its default value.
  augmentation:
    horizontal_flip_p:  0.5
    vertical_flip_p:    0.5
    random_rotate90_p:  0.5
    shift_scale_rotate:
      shift_limit:  0.1
      scale_limit:  0.1
      rotate_limit: 30
      p:            0.3
    brightness_contrast:
      brightness_limit: 0.2
      contrast_limit:   0.2
      p:                0.3

training:
  epochs: 200
  lr: 0.001
  optimizer: "adamw"       # "adam" | "adamw" | "sgd"
  weight_decay: 0.0001

  # Adam / AdamW betas and epsilon
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8

  # SGD-specific
  momentum: 0.9            # for SGD
  nesterov: false          # Nesterov SGD (default: false)

  scheduler: "cosine"      # "cosine" | "step" | "plateau" | "onecycle" | "none"
  lr_step_size: 10         # StepLR step size
  lr_gamma: 0.5            # StepLR / ReduceLROnPlateau decay factor
  warmup_epochs: 5         # learning rate warmup / pct_start for OneCycleLR

  # ReduceLROnPlateau-specific (scheduler: "plateau")
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5

  loss_type: "structure"       # "bce" | "dice" | "structure" | "combo" | "adaptive_guide_fusion"
  loss_kwargs: {}          # extra kwargs forwarded to the loss constructor
                           # e.g. for combo: {bce_weight: 0.5, dice_weight: 0.5}

  device: "cuda"           # "cuda" or "cpu"
  seed: 42
  amp: true                # Automatic Mixed Precision (CUDA only)
  grad_clip_mode: "value"  # "value" (default, MK-UNet recipe) | "norm" | "none"
  grad_clip_value: 0.5     # used when grad_clip_mode: "value"
  grad_clip_norm: 1.0      # used when grad_clip_mode: "norm"

  # Gradient accumulation: effective batch size = batch_size × accumulate_grad_batches
  # Useful when heavier models force batch_size down to 1-2.
  accumulate_grad_batches: 1  # 1 = disabled (step every batch)

  # Exponential Moving Average weights (often a free +0.5–1 pt on Dice)
  ema:
    enabled: false
    decay: 0.9999

k_fold:
  enabled: true           # Set to true to run K-Fold cross validation
  n_splits: 5              # Number of folds
  run_folds: null          # List of folds to run (e.g. [0, 1, 2]), null means run all

checkpoint:
  save_dir: "checkpoints"
  resume: true
  checkpoint_path: ""      # Path to load checkpoint for resume or eval
  monitor_metric: "val_dice" # Metric to monitor for best model ("val_dice", "val_miou", "val_loss")
  mode: "max"              # "max" or "min"
  periodic_save_every: 0   # Save epoch_NNNN.pth every N epochs; 0 = disabled

early_stopping:
  enabled: true           # Set to true to enable early stopping
  patience: 15             # Epochs to wait without improvement before stopping
  min_delta: 0.0001           # Minimum absolute change to count as an improvement
  # mode is inherited from checkpoint.mode; no need to repeat it here

  # Prediction overlay visualisation.
  # A side-by-side [Input | Ground Truth | Prediction] grid is saved every
  # `overlay_save_every` epochs.  Set to 0 or `save_overlays: false` to disable.
  save_overlays: true
  overlay_save_every: 10   # epoch interval (default: every 10 epochs)
  overlay_n_samples: 4     # number of images per grid

# ---------------------------------------------------------------------------
# Multi-stage training (optional).
# When present, Trainer.fit() iterates these stages sequentially instead of
# using the single training.epochs / training.lr values above.
# Each stage runs for `epochs` epochs at `lr`, optionally freezing submodules
# whose names contain any fragment listed in `freeze`.
# ---------------------------------------------------------------------------
# stages:
#   - epochs: 20
#     lr: 1.0e-3
#     freeze: []                # nothing frozen; train everything
#   - epochs: 30
#     lr: 5.0e-4
#     freeze: ["encoder"]       # freeze all encoder submodules
stages: []                    # empty list = use legacy training.epochs / training.lr

logging:
  log_dir: "logs"
  tb_dir: "runs"           # TensorBoard event log directory
  experiment_name: "gmkunet_s_clinicdb"
  log_interval: 10         # Print/log training progress every N batches
