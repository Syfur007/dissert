# GMK-UNet (large) on ClinicDB — overrides on top of base_config.yaml.
# See ../../base_config.yaml for every inherited default (early stopping,
# EMA, augmentation, checkpointing, etc.).
compose: ["../../base_config.yaml"]

model:
  name: "gmk_unet"
  channels: [64, 128, 256, 384, 512]
  depths: [1, 1, 1, 1, 1]        # MKIR depth at each stage
  kernel_sizes: [1, 3, 5]        # MKDC kernel sizes
  expansion_factor: 2
  gag_kernel: 3
  use_rgb_skip: true

dataset:
  batch_size: 16

logging:
  experiment_name: "gmkunet_l_clinicdb"
