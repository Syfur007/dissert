# EMCAD on ClinicDB — overrides on top of base_config.yaml.
# See base_config.yaml for every inherited default (early stopping, EMA,
# augmentation, checkpointing, etc.) — only the values that differ from it
# are listed here.
compose: ["base_config.yaml"]

model:
  name: "emcad"
  kernel_sizes: [1, 3, 5]       # MKDC kernel sizes
  expansion_factor: 2
  dw_parallel: True
  add: True
  lgag_ks: 3
  activation: 'relu'
  encoder: 'pvt_v2_b2'
  pretrain: True
  pretrained_dir: './pretrained_pth/pvt/'

training:
  loss_type: "combo"       # "bce" | "dice" | "structure" | "combo" | "adaptive_guide_fusion"
  grad_clip_mode: "norm"   # EMCAD recipe clips by norm, not by value
  grad_clip_norm: 0.5

logging:
  experiment_name: "emcad_clinicdb"
