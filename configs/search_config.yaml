# Hyperparameter Search Configuration

search:
  method: "grid"           # "grid" (exhaustive Cartesian) or "random" (sampled subset)
  num_trials: 5            # Max trials to run when method is "random"
  seed: 42                 # RNG seed for reproducible random sampling
  output_dir: "outputs/searches/search"

# Param grid: list of values to search over for each hyperparameter.
# Nested keys mirror the structure of the base config YAML.
# All list entries are combined into a Cartesian product for grid search,
# or sampled (without replacement) for random search.
grid:
  training:
    lr: [0.01, 0.001, 0.0001]
    optimizer: ["adamw", "sgd"]
  dataset:
    batch_size: [4, 8]
  model:
    name: ["unet", "attention_unet"]
