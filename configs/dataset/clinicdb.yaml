# CVC-ClinicDB dataset identity fragment. Compose this into an experiment
# config to select ClinicDB — do not duplicate name/root inline; that's how
# an experiment can silently drift onto the wrong dataset (see ColonDB fix
# in CHANGELOG.md's Phase 1 entry).
dataset:
  name: "ClinicDB"
  root: "data/polyp/ClinicDB"
