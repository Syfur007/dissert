# Configuration settings for Deep Learning Segmentation Pipeline

model:
  name: "unet"             # "unet" or "attention_unet"
  in_channels: 3
  out_channels: 1          # 1 for binary segmentation, >1 for multi-class
  features: [64, 128, 256, 512]

dataset:
  name: "ClinicDB"
  root: "data/polyp/ClinicDB"

  # Optional: override the list files used for each split (defaults are inside root/)
  # train_list: "data/polyp/ClinicDB/train_list_clinicdb.txt"
  # val_list:   "data/polyp/ClinicDB/val_list_clinicdb.txt"
  # test_list:  "data/polyp/ClinicDB/test_list_clinicdb.txt"

  img_height: 256
  img_width: 256
  batch_size: 8
  num_workers: 4

  # Dataset-specific normalisation stats.
  # Run `python -m datasets.stats --config <this_file>` on the training split
  # to compute these values for a new dataset, then paste the output here.
  # When absent, ImageNet defaults are used (appropriate for natural images;
  # suboptimal for ACDC, DSB18 etc).
  # norm_mean: [0.485, 0.456, 0.406]
  # norm_std:  [0.229, 0.224, 0.225]

  # Integrity check: scan all pairs at startup and report every broken pair
  # before training begins.  Disable for very large datasets where the I/O
  # cost at launch is unacceptable.
  validate: false

  # In-RAM caching: load all raw images into memory on construction.
  # Guarded by cache_size_limit_gb — silently disabled if the dataset
  # would exceed that footprint.  Worthwhile for small datasets (BUSI,
  # ISIC18) during heavy ablation sweeps.
  cache: false
  cache_size_limit_gb: 4.0   # safe for a 16 GB RAM machine

  # Auto-split ratios.  Only needed for flat-directory datasets that do not
  # ship with pre-made train/val/test splits (e.g. raw ISIC18 / DSB18 dumps).
  # Ignored when the dataset has a registered handler with its own splits.
  # split:
  #   train: 0.8
  #   val:   0.1
  #   test:  0.1

  # Augmentation parameters.  Omitting any key keeps its default value.
  augmentation:
    horizontal_flip_p:  0.5
    vertical_flip_p:    0.5
    random_rotate90_p:  0.5
    shift_scale_rotate:
      shift_limit:  0.1
      scale_limit:  0.1
      rotate_limit: 30
      p:            0.5
    brightness_contrast:
      brightness_limit: 0.2
      contrast_limit:   0.2
      p:                0.5

training:
  epochs: 50
  lr: 0.001
  optimizer: "adamw"       # "adam", "adamw", "sgd"
  weight_decay: 0.0001
  momentum: 0.9            # for SGD
  scheduler: "cosine"      # "cosine", "step", "none"
  lr_step_size: 10
  lr_gamma: 0.5
  warmup_epochs: 5         # learning rate warmup
  loss_type: "combo"       # "bce", "dice", "combo" (BCE + Dice)
  device: "cuda"           # "cuda" or "cpu"
  seed: 42
  amp: true                # default: false
  grad_clip_norm: 0.5      # default: null (disabled)

k_fold:
  enabled: false           # Set to true to run K-Fold cross validation
  n_splits: 5              # Number of folds
  run_folds: null          # List of folds to run (e.g. [0, 1, 2]), null means run all

checkpoint:
  save_dir: "checkpoints"
  resume: true
  checkpoint_path: ""      # Path to load checkpoint for resume or eval
  monitor_metric: "val_dice" # Metric to monitor for best model ("val_dice", "val_miou", "val_loss")
  mode: "max"              # "max" or "min"

early_stopping:
  enabled: false           # Set to true to enable early stopping
  patience: 20             # Epochs to wait without improvement before stopping
  min_delta: 0.0           # Minimum absolute change to count as an improvement
  # mode is inherited from checkpoint.mode; no need to repeat it here

logging:
  log_dir: "logs"
  tb_dir: "runs"           # TensorBoard event log directory
  experiment_name: "clinicdb_unet"
  log_interval: 10         # Print/log training progress every N batches
