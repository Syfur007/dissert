name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate coverage reports

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # pyproject.toml pins torch/torchvision to their cu117 wheel URLs
      # directly (see its dependency comment) — those wheels import and run
      # fine on this GPU-less runner too, so no separate CPU-wheel step.
      - name: Install dissert (editable, dev extras)
        run: |
          pip install --prefer-binary -e .[dev]

      - name: pip check
        run: pip check

      - name: Run test suite
        run: pytest tests/ -v
