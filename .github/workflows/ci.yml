name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate coverage reports

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # CPU wheels — a standard GitHub-hosted runner has no GPU/CUDA, and
      # the pinned CUDA build (see requirements.txt's top comment block)
      # only exists as a wheel on PyTorch's own cu11x/cu12x index anyway.
      - name: Install torch/torchvision (CPU)
        run: |
          pip install --prefer-binary --index-url https://download.pytorch.org/whl/cpu \
            torch==1.13.1 torchvision==0.14.1
      - name: Install dissert (editable, dev extras)
        run: |
          pip install --prefer-binary -e .[dev]

      - name: pip check
        run: pip check

      - name: Run test suite
        run: pytest tests/ -v
