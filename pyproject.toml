[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dissert"
version = "0.1.0"
description = "A config-driven PyTorch framework for medical image segmentation research"
requires-python = ">=3.10,<3.11"
# Phase 1 (Python 3.10, torch stays 1.13.1): timm/huggingface-hub/captum
# bumped, opencv forced down to a numpy<2-compatible release, mamba-ssm/
# causal-conv1d wheel tags moved to cp310, and the ~15 never-imported
# packages from the Phase 0 audit (§1.1 of docs/design/transfer-xai-plan.md)
# removed. torch/torchvision/numpy/scipy/scikit-learn/scikit-image/pandas/
# albumentations stay pinned exactly as before.
dependencies = [
    # PyTorch: CPU-only PyPI wheels by default — no PEP 508 marker can detect
    # actual GPU presence (only OS/arch), so an unconditional "auto-select
    # CUDA" rule would force the ~1.8GB cu117 wheel onto every Linux/x86_64
    # machine, GPU-less dev boxes included. A real GPU training box opts in
    # explicitly instead: `pip install -e .[dev,gpu]` (the `gpu` extra below).
    "torch==1.13.1",
    "torchvision==0.14.1",

    # Numeric stack pinned together (not just numpy) — these are the exact
    # versions this project is developed/tested against. scipy/scikit-learn/
    # scikit-image/pandas were previously left unbounded next to a hard-pinned
    # numpy, which risked pip resolving a newer release that's dropped support
    # for numpy 1.22's ABI.
    "numpy==1.22.4",
    "scipy==1.10.1",
    "scikit-learn==1.3.2",
    "scikit-image==0.21.0",
    "pandas==2.0.3",

    "loguru",
    "tqdm",
    "pyyaml",
    "matplotlib",
    # opencv 5.0.0.93 declares numpy>=2 on Python>=3.9, which breaks the
    # numpy<2 pin torch 1.13 requires. Force both opencv distributions
    # (both install the `cv2` module; grad-cam depends on the headless one)
    # down to the last 4.x release, matched exactly.
    "opencv-python==4.11.0.86",
    "opencv-python-headless==4.11.0.86",
    "seaborn",
    "albumentations==1.1.0",
    "tabulate",
    "timm==1.0.30",
    "pillow",
    "thop",
    # huggingface-hub current as of the Phase 1 dry run (2026-09-25); timm
    # uses it to download pretrained weights.
    "huggingface-hub==2.0.0",
    "tensorboardx",
    "medpy",

    # config schema validation.
    "pydantic>=2,<3",

    # metrics/aggregate.py's write_per_image_parquet() (pandas.DataFrame.to_parquet
    # needs a parquet engine; pandas itself doesn't bundle one). Pinned to 17.0.0 — the last
    # release with a Python 3.8 wheel (18.0.0+ dropped 3.8); bump alongside a future Python bump.
    "pyarrow==17.0.0",

    # paired statistical tests / effect sizes.
    "statsmodels",

    # FLOPs/params profiling (used alongside the existing torchprofile/ptflops/thop
    # — fvcore's counter is what the analytic selective-scan counter hooks into).
    "fvcore",

    # profiling/export.py's ONNX export path (torch.onnx.export needs this
    # installed to fully serialise). TensorRT is attempted only if the
    # separate, GPU-vendor-specific `tensorrt` package happens to be installed —
    # not pinned here; its absence is a legitimate, reportable export failure,
    # not an error.
    "onnx",

    # attribution/explainability (occlusion, integrated gradients). Pinned
    # to the last release that still allows torch <2.3 (0.9.0+ needs torch
    # >=2.3, and we stay on 1.13.1) — unpinned resolved to 0.7.0 on Python
    # 3.8.
    "captum==0.8.0",
]

# mamba-ssm/causal-conv1d are Phase 6's Mamba-family CUDA extensions, not
# on PyPI — GitHub-release wheels only, and only for a CUDA (GPU) build.
# Not listed in `dependencies` because there's no CPU wheel; install
# manually on the GPU training machine with the cp310 tag:
#   pip install mamba-ssm==1.0.1 --no-build-isolation \
#     https://github.com/state-spaces/mamba/releases/download/v1.0.1/mamba_ssm-1.0.1+cu118torch1.13cxx11abiFALSE-cp310-cp310-linux_x86_64.whl
#   pip install causal-conv1d==1.1.1 \
#     https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.1.1/causal_conv1d-1.1.1+cu118torch1.13cxx11abiFALSE-cp310-cp310-linux_x86_64.whl
# (cp38 tag → cp310; everything else in the wheel filename is unchanged.)

[project.optional-dependencies]
dev = ["pytest>=8"]

# Opt-in on an actual GPU training box: `pip install -e .[dev,gpu]` replaces
# the CPU-only torch/torchvision above with the exact cu117 build (direct
# wheel URL — no separate --extra-index-url step). If your driver predates
# CUDA 11.7, swap both URLs for the cu116 build instead (check `nvidia-smi`
# first): https://download.pytorch.org/whl/cu116/torch-1.13.1%2Bcu116-cp310-cp310-linux_x86_64.whl
gpu = [
    "torch @ https://download.pytorch.org/whl/cu117/torch-1.13.1%2Bcu117-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision @ https://download.pytorch.org/whl/cu117/torchvision-0.14.1%2Bcu117-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
train = "dissert.cli.train:main"
eval = "dissert.cli.eval:main"
search = "dissert.cli.search:main"
report = "dissert.cli.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
